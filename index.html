<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --text: var(--tg-theme-text-color, #18181b);
    --hint: var(--tg-theme-hint-color, #71717a);
    --danger: var(--tg-theme-destructive-text-color, #b91c1c);
    --section: var(--tg-theme-section-bg-color, var(--bg));
    /* строгий стиль: акцент — цвет текста, без ярких цветов */
    --accent: var(--text);
    --accent-text: var(--bg);
    --line: color-mix(in srgb, var(--hint) 28%, transparent);
    --radius: 4px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  body { padding-bottom: 72px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 10px; width: 100%; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--text); }
  textarea { resize: vertical; min-height: 64px; }

  header { padding: 18px 16px 12px; background: var(--section); border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  header .sub { color: var(--hint); font-size: 13px; margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-block; padding: 1px 6px; border: 1px solid var(--line); border-radius: var(--radius);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }

  .days { display: flex; margin: 0 16px 12px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--section); }
  .day { flex: 1; padding: 7px 0; text-align: center; border-left: 1px solid var(--line); }
  .day:first-child { border-left: 0; }
  .day b { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .day small { color: var(--hint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .day.active { background: var(--accent); color: var(--accent-text); }
  .day.active small { color: inherit; opacity: .7; }
  .day.today:not(.active) b { text-decoration: underline; text-underline-offset: 3px; }

  .seg { display: flex; margin: 0 16px 8px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--section); }
  .seg button { flex: 1; padding: 7px 4px; font-size: 13px; color: var(--hint); border-left: 1px solid var(--line); }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }

  .list { margin: 0 16px; background: var(--section); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card { padding: 12px 14px; display: flex; gap: 14px; position: relative; border-top: 1px solid var(--line); }
  .card:first-child { border-top: 0; }
  .card .time { width: 46px; flex: none; font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); padding-right: 10px; }
  .card .time b { display: block; font-size: 14px; font-weight: 600; }
  .card .time small { color: var(--hint); font-size: 12px; }
  .card .body { flex: 1; min-width: 0; }
  .card .title { font-weight: 600; }
  .card .meta { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .card .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); }
  .card.now { box-shadow: inset 3px 0 0 var(--accent); }
  .card.past { opacity: .5; }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    color: var(--hint); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-left: 8px; vertical-align: 2px; }
  .t-ex { color: var(--danger); border-color: currentColor; }
  .weeks { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--hint); margin-left: 6px; vertical-align: 2px; }
  .gap { padding: 4px 14px; color: var(--hint); font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    background: var(--bg2); border-top: 1px solid var(--line); }

  .status { margin: 0 16px 12px; padding: 12px 14px; background: var(--section); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: var(--radius); }
  .status .lbl { display: block; font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .status small { color: var(--hint); }

  .empty { text-align: center; color: var(--hint); padding: 48px 24px; font-size: 14px; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  .task { align-items: center; }
  .check { width: 20px; height: 20px; flex: none; border-radius: 3px; border: 1.5px solid var(--hint);
    display: grid; place-items: center; font-size: 13px; line-height: 1; }
  .task.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .task.done .title { text-decoration: line-through; color: var(--hint); font-weight: 400; }
  .due-late { color: var(--danger) !important; font-weight: 600; }

  .fab { position: fixed; right: 16px; bottom: 76px; height: 40px; padding: 0 16px; border-radius: var(--radius);
    background: var(--accent); color: var(--accent-text); font-size: 14px; font-weight: 600; z-index: 5;
    display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .fab svg { width: 16px; height: 16px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--section);
    border-top: 1px solid var(--line); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 6; }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--hint); padding: 4px 0; }
  nav button svg { width: 20px; height: 20px; }
  nav button.on { color: var(--text); font-weight: 600; }

  svg.i { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--bg);
    border-radius: 8px 8px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform .2s ease-out; }
  .sheet:not(.open) { visibility: hidden; transition: transform .2s ease-out, visibility 0s .2s; }
  .sheet.open { transform: none; }
  .sheet h2 { margin: 0 0 14px; font-size: 17px; font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .sheet h2 .del { color: var(--danger); font-size: 14px; font-weight: 600; padding: 4px 0 4px 12px; }
  .dialog-bg { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 24px; }
  .dialog { background: var(--bg); border-radius: 8px; padding: 18px 16px 14px; width: 100%; max-width: 320px; }
  .dialog p { margin: 0 0 12px; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.ghost-neutral { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; color: var(--hint); margin: 0 0 4px; text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .btn { display: block; width: 100%; padding: 11px; border-radius: var(--radius); background: var(--accent); color: var(--accent-text); font-weight: 600; margin-top: 8px; }
  .btn.ghost { background: transparent; color: var(--danger); border: 1px solid var(--line); }
  .tg .btn.primary { display: none; } /* в Telegram сохраняем через MainButton */

  .section-title { margin: 16px 16px 6px; font-size: 11px; color: var(--hint); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .settings { padding: 0 16px; }
  .settings .group { background: var(--section); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .settings h3 { margin: 0 0 10px; font-size: 11px; color: var(--hint); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .bell { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .bell span { width: 18px; color: var(--hint); font-size: 13px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--hint); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Сегодня</h1>
  <div class="sub" id="subtitle"></div>
</header>
<main id="view"></main>
<button class="fab" id="fab"><svg class="i" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12"/></svg><span>Добавить</span></button>

<nav>
  <button data-tab="today" class="on"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Сегодня</button>
  <button data-tab="week"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Неделя</button>
  <button data-tab="tasks"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 12l3 3 5-6"/></svg>Задания</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>

<script>
const tg = window.Telegram?.WebApp;
const inTg = !!(tg && tg.initData);
if (inTg) {
  document.body.classList.add('tg');
  tg.ready();
  tg.expand();
  // MainButton и шапка в тон строгому оформлению
  const tp = tg.themeParams || {};
  if (tp.text_color && tp.bg_color) tg.MainButton.setParams({ color: tp.text_color, text_color: tp.bg_color });
  if (tg.setHeaderColor && tp.section_bg_color) tg.setHeaderColor(tp.section_bg_color);
}

const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const DAYS_FULL = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const TYPES = { lec: 'Лекция', pr: 'Практика', lab: 'Лаба', ex: 'Экзамен', other: 'Другое' };
const BELLS = Object.freeze([
  ['09:00', '10:30'], ['10:40', '12:10'], ['12:40', '14:10'], ['14:20', '15:50'],
  ['16:00', '17:30'], ['17:40', '19:10'], ['19:20', '20:50'],
].map(b => Object.freeze(b)));

// ---------- хранилище ----------
// Telegram CloudStorage ограничивает значение 4096 символами, поэтому режем JSON на куски.
const CHUNK = 4000;
const useCloud = inTg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9');
const cloud = {
  get: keys => new Promise((res, rej) => tg.CloudStorage.getItems(keys, (e, v) => e ? rej(e) : res(v))),
  set: (k, v) => new Promise((res, rej) => tg.CloudStorage.setItem(k, v, (e) => e ? rej(e) : res())),
};
const store = {
  async load(key, fallback) {
    try {
      if (!useCloud) {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      }
      const meta = await cloud.get([key + '_n']);
      const n = parseInt(meta[key + '_n'] || '0', 10);
      if (!n) return fallback;
      const keys = Array.from({ length: n }, (_, i) => `${key}_${i}`);
      const parts = await cloud.get(keys);
      return JSON.parse(keys.map(k => parts[k] || '').join(''));
    } catch (e) { console.warn('load', key, e); return fallback; }
  },
  async save(key, value) {
    const s = JSON.stringify(value);
    try {
      if (!useCloud) { localStorage.setItem(key, s); return; }
      const chunks = [];
      for (let i = 0; i < s.length; i += CHUNK) chunks.push(s.slice(i, i + CHUNK));
      if (!chunks.length) chunks.push('');
      await Promise.all(chunks.map((c, i) => cloud.set(`${key}_${i}`, c)));
      await cloud.set(key + '_n', String(chunks.length));
    } catch (e) { console.warn('save', key, e); toast('Не удалось сохранить'); }
  },
};

// ---------- состояние ----------
const state = {
  tab: 'today',
  weekDay: dayIdx(new Date()),
  weekFilter: 'current', // current | odd | even
  taskFilter: 'open',
  lessons: [],
  tasks: [],
  settings: { semesterStart: defaultSemesterStart(), firstWeekOdd: false },
};

// ---------- утилиты ----------
function dayIdx(d) { return (d.getDay() + 6) % 7; }
function pad(n) { return String(n).padStart(2, '0'); }
function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function toMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function defaultSemesterStart() {
  const now = new Date();
  // осенний семестр с 1 сентября, весенний — с 1 февраля
  const y = now.getFullYear(), m = now.getMonth();
  return m >= 8 ? `${y}-09-01` : m >= 1 ? `${y}-02-01` : `${y - 1}-09-01`;
}
function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - dayIdx(x)); return x; }
function weekNumber(d = new Date()) {
  const start = mondayOf(parseDate(state.settings.semesterStart));
  const diff = Math.round((mondayOf(d) - start) / (7 * 864e5));
  return diff + 1;
}
function isOddWeek(d = new Date()) {
  const odd = Math.abs(weekNumber(d)) % 2 === 1;
  return state.settings.firstWeekOdd ? odd : !odd;
}
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
function fmtDuration(min) {
  if (min < 60) return `${min} мин`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h} ч ${m} мин` : `${h} ч`;
}
function haptic(kind = 'light') {
  if (!inTg || !tg.HapticFeedback) return;
  if (kind === 'success' || kind === 'error' || kind === 'warning') tg.HapticFeedback.notificationOccurred(kind);
  else tg.HapticFeedback.impactOccurred(kind);
}
const tgPopups = inTg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2');
function toast(msg) {
  if (tgPopups) { try { return tg.showAlert(msg); } catch (e) { console.warn(e); } }
  try { alert(msg); } catch (e) { console.warn(e); }
}
// Подтверждение: нативный попап Telegram, иначе confirm(), иначе — встроенный диалог
// (в некоторых WebView confirm() молча возвращает false).
function confirmAsk(msg) {
  return new Promise(res => {
    if (tgPopups) {
      try { tg.showConfirm(msg, ok => res(!!ok)); return; } catch (e) { console.warn(e); }
    }
    if (!inTg) { try { return res(confirm(msg)); } catch (e) { console.warn(e); } }
    inlineConfirm(msg, res);
  });
}
function inlineConfirm(msg, res) {
  const box = document.createElement('div');
  box.className = 'dialog-bg';
  box.innerHTML = `<div class="dialog"><p>${esc(msg)}</p><div class="row">
    <button class="btn ghost-neutral" data-a="0">Отмена</button><button class="btn danger" data-a="1">Удалить</button></div></div>`;
  box.onclick = e => {
    const b = e.target.closest('[data-a]');
    if (!b && e.target !== box) return;
    box.remove(); res(b ? b.dataset.a === '1' : false);
  };
  document.body.appendChild(box);
}

function lessonsFor(day, odd) {
  return state.lessons
    .filter(l => l.day === day && (l.weeks === 'all' || (l.weeks === 'odd') === odd))
    .sort((a, b) => toMin(a.start) - toMin(b.start));
}

// ---------- рендер ----------
const $view = document.getElementById('view');
const $title = document.getElementById('title');
const $sub = document.getElementById('subtitle');
const $fab = document.getElementById('fab');

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  const now = new Date();
  const wn = weekNumber(now);
  const parity = isOddWeek(now) ? 'нечётная' : 'чётная';
  $sub.innerHTML = `${now.getDate()} ${MONTHS[now.getMonth()]}, ${DAYS_FULL[dayIdx(now)].toLowerCase()}
    <span class="chip">${wn > 0 ? wn + ' неделя · ' : ''}${parity}</span>`;
  ({ today: renderToday, week: renderWeek, tasks: renderTasks })[state.tab]();
}

function lessonCard(l, opts = {}) {
  const meta = [l.room && `ауд. ${esc(l.room)}`, l.teacher && esc(l.teacher)].filter(Boolean).join(' · ');
  const weeks = l.weeks === 'odd' ? 'неч.' : l.weeks === 'even' ? 'чёт.' : '';
  return `<div class="card ${opts.cls || ''}" data-lesson="${l.id}">
    <div class="time"><b>${l.start}</b><small>${l.end}</small></div>
    <div class="body">
      <div class="title">${esc(l.subject)}<span class="badge t-${l.type}">${TYPES[l.type] || ''}</span>${weeks ? `<span class="weeks">${weeks}</span>` : ''}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ''}
      ${opts.extra || ''}
    </div>
    ${opts.progress != null ? `<div class="bar" style="width:${opts.progress}%"></div>` : ''}
  </div>`;
}

function renderToday() {
  $title.textContent = 'Сегодня';
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const list = lessonsFor(dayIdx(now), isOddWeek(now));

  if (!list.length) {
    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    const tl = lessonsFor(dayIdx(tomorrow), isOddWeek(tomorrow));
    $view.innerHTML = `<div class="empty"><b>Сегодня занятий нет</b>${
      tl.length ? `Завтра ${tl.length} ${plural(tl.length, 'пара', 'пары', 'пар')}, первая в ${tl[0].start}` : ''}</div>`
      + todayTasks();
    return;
  }

  let status = '';
  const cur = list.find(l => toMin(l.start) <= nowMin && nowMin < toMin(l.end));
  const next = list.find(l => toMin(l.start) > nowMin);
  if (cur) status = `<span class="lbl">Идёт занятие</span><b>${esc(cur.subject)}</b>${cur.room ? ', ауд. ' + esc(cur.room) : ''}<br><small>до окончания ${fmtDuration(toMin(cur.end) - nowMin)}</small>`;
  else if (next) status = `<span class="lbl">Следующее занятие</span><b>${esc(next.subject)}</b>${next.room ? ', ауд. ' + esc(next.room) : ''}<br><small>через ${fmtDuration(toMin(next.start) - nowMin)}</small>`;
  else status = `<span class="lbl">Статус</span>Занятия на сегодня завершены`;

  let html = `<div class="status">${status}</div><div class="list">`;
  list.forEach((l, i) => {
    const s = toMin(l.start), e = toMin(l.end);
    if (i > 0) {
      const gap = s - toMin(list[i - 1].end);
      if (gap >= 30) html += `<div class="gap">перерыв ${fmtDuration(gap)}</div>`;
    }
    const isNow = s <= nowMin && nowMin < e;
    html += lessonCard(l, {
      cls: isNow ? 'now' : nowMin >= e ? 'past' : '',
      progress: isNow ? Math.round((nowMin - s) / (e - s) * 100) : null,
    });
  });
  $view.innerHTML = html + '</div>' + todayTasks();
}

function todayTasks() {
  const soon = new Date(); soon.setDate(soon.getDate() + 3);
  const lim = isoDate(soon);
  const list = state.tasks.filter(t => !t.done && t.due && t.due <= lim).sort((a, b) => a.due.localeCompare(b.due));
  if (!list.length) return '';
  return `<div class="section-title">Ближайшие сроки сдачи</div><div class="list">${list.map(taskCard).join('')}</div>`;
}

function renderWeek() {
  $title.textContent = 'Неделя';
  const now = new Date();
  const curOdd = isOddWeek(now);
  const odd = state.weekFilter === 'current' ? curOdd : state.weekFilter === 'odd';
  const monday = mondayOf(now);
  // если смотрим «другую» неделю — показываем даты следующей
  if (state.weekFilter !== 'current' && odd !== curOdd) monday.setDate(monday.getDate() + 7);

  let html = `<div class="seg">
    <button data-wf="current" class="${state.weekFilter === 'current' ? 'on' : ''}">Текущая</button>
    <button data-wf="odd" class="${state.weekFilter === 'odd' ? 'on' : ''}">Нечётная</button>
    <button data-wf="even" class="${state.weekFilter === 'even' ? 'on' : ''}">Чётная</button>
  </div><div class="days">`;
  DAYS.forEach((d, i) => {
    const date = new Date(monday); date.setDate(monday.getDate() + i);
    const cnt = lessonsFor(i, odd).length;
    const isToday = isoDate(date) === isoDate(now);
    html += `<button class="day ${i === state.weekDay ? 'active' : ''} ${isToday ? 'today' : ''}" data-day="${i}">
      <b>${d}</b><small>${date.getDate()}${cnt ? ' · ' + cnt : ''}</small></button>`;
  });
  html += '</div>';
  const list = lessonsFor(state.weekDay, odd);
  html += list.length
    ? `<div class="list">${list.map(l => lessonCard(l)).join('')}</div>`
    : `<div class="empty"><b>${DAYS_FULL[state.weekDay]}: занятий нет</b>Чтобы добавить пару, нажмите «Добавить»</div>`;
  $view.innerHTML = html;
}

function taskCard(t) {
  const today = isoDate(new Date());
  let due = '';
  if (t.due) {
    const d = parseDate(t.due);
    const days = Math.round((d - parseDate(today)) / 864e5);
    const label = days === 0 ? 'сегодня' : days === 1 ? 'завтра' : days === -1 ? 'вчера' : `${d.getDate()} ${MONTHS[d.getMonth()]}`;
    due = `<span class="${!t.done && days < 0 ? 'due-late' : ''}">срок: ${label}</span>`;
  }
  const meta = [t.subject && esc(t.subject), due].filter(Boolean).join(' · ');
  return `<div class="card task ${t.done ? 'done' : ''}" data-task="${t.id}">
    <button class="check" data-toggle="${t.id}">${t.done ? '✓' : ''}</button>
    <div class="body"><div class="title">${esc(t.text)}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>
  </div>`;
}

function renderTasks() {
  $title.textContent = 'Задания';
  const f = state.taskFilter;
  const list = state.tasks
    .filter(t => f === 'all' || (f === 'open' ? !t.done : t.done))
    .sort((a, b) => (a.done - b.done) || (a.due || '9').localeCompare(b.due || '9'));
  const open = state.tasks.filter(t => !t.done).length;
  $view.innerHTML = `<div class="seg">
      <button data-tf="open" class="${f === 'open' ? 'on' : ''}">Активные${open ? ' · ' + open : ''}</button>
      <button data-tf="done" class="${f === 'done' ? 'on' : ''}">Сделано</button>
      <button data-tf="all" class="${f === 'all' ? 'on' : ''}">Все</button>
    </div>` + (list.length
      ? `<div class="list">${list.map(taskCard).join('')}</div>`
      : `<div class="empty"><b>${f === 'done' ? 'Выполненных заданий нет' : 'Заданий нет'}</b></div>`);
}

// ---------- группы (расписание из файла вуза, groups.json) ----------
let groupsData = null;
async function loadGroups() {
  try {
    const r = await fetch('groups.json', { cache: 'no-cache' });
    if (r.ok) groupsData = await r.json();
  } catch (e) { console.warn('groups.json', e); }
  return groupsData;
}
const findGroup = id => groupsData?.groups.find(g => g.id === id);
const groupLabel = g => g ? `${g.name}${g.sub ? ', ' + g.sub : ''}` : '';

function buildGroupLessons(gid) {
  const choices = state.settings.choices || {};
  return groupsData.lessons
    .filter(l => l.groups.includes(gid) && (!l.choice || choices[l.choice] === l.option))
    .map((l, i) => ({ id: 'g' + i, src: 'group', day: l.day, num: l.num, start: l.start, end: l.end,
      subject: l.subject, type: l.type, room: l.room, teacher: l.teacher, weeks: l.weeks }));
}
async function applyGroup() {
  const gid = state.settings.group;
  if (!groupsData || !findGroup(gid)) return;
  // свои (добавленные вручную) пары сохраняем, групповые заменяем
  const own = state.lessons.filter(l => l.src !== 'group' && !String(l.id).startsWith('seed'));
  state.lessons = [...buildGroupLessons(gid), ...own];
  state.settings.groupsVersion = groupsData.version;
  await Promise.all([store.save('lessons', state.lessons), store.save('settings', state.settings)]);
}

// Поиск группы по ФИО: в groups.json лежат только отпечатки PBKDF2, самих имён там нет.
function normFio(s) {
  return String(s).normalize('NFC').toLowerCase().replace(/ё/g, 'е').replace(/[‐–—]/g, '-').trim().split(/\s+/).join(' ');
}
async function lookupFio(fio) {
  const lk = groupsData?.lookup;
  if (!lk || !crypto?.subtle) return null;
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(normFio(fio)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(lk.salt), iterations: lk.iterations }, key, lk.bytes * 8);
  const hex = Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, '0')).join('');
  return lk.index[hex] || null;
}

function groupPicker(first) {
  if (!groupsData) return toast('Не удалось загрузить список групп. Проверьте интернет.');
  const byTitle = {};
  groupsData.groups.forEach(g => (byTitle[g.title] = byTitle[g.title] || []).push(g));
  const cur = state.settings.group;
  openSheet(`<h2>Выберите группу</h2>
    ${first ? `<div class="hint" style="margin:-6px 0 12px">Расписание подставится автоматически. Сменить группу — командой /group в боте.</div>` : ''}
    ${groupsData.lookup ? `<div class="field"><label>Найти себя по ФИО</label>
      <div class="row" style="align-items:stretch"><input id="fioInp" placeholder="Фамилия Имя Отчество" autocomplete="off" style="flex:3">
      <button class="btn" id="fioBtn" style="margin:0;flex:1;width:auto">Найти</button></div>
      <div class="hint" id="fioHint">Полностью, как в списке группы. ФИО никуда не отправляется и не сохраняется.</div></div>
      <div class="section-title" style="margin:14px 0 0">или выберите вручную</div>` : ''}
    ${Object.entries(byTitle).map(([title, gs]) => `<div class="section-title" style="margin:12px 0 6px">${esc(title)}</div>
      <div class="list" style="margin:0">${gs.map(g => `<button class="card" data-pick="${g.id}" style="width:100%;text-align:left">
        <div class="body"><div class="title">${esc(g.name)}</div>${g.sub ? `<div class="meta">${esc(g.sub)}</div>` : ''}</div>
        ${g.id === cur ? '<b>✓</b>' : ''}</button>`).join('')}</div>`).join('')}
    ${first ? '<button class="btn ghost-neutral" id="pickSkip" style="margin-top:14px">Заполню расписание сам</button>' : ''}`,
    null, { locked: first });
  $sheet.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pickGroup(b.dataset.pick));
  const fioInp = document.getElementById('fioInp');
  if (fioInp) {
    const go = async () => {
      const hint = document.getElementById('fioHint');
      const v = fioInp.value;
      if (normFio(v).split(' ').length < 2) { hint.textContent = 'Введите фамилию, имя и отчество полностью'; return; }
      hint.textContent = 'Ищу…';
      const gid = await lookupFio(v);
      fioInp.value = '';
      if (gid && findGroup(gid)) { haptic('success'); pickGroup(gid); }
      else { haptic('error'); hint.innerHTML = '<span class="due-late">Не нашли.</span> Проверьте написание или выберите подгруппу ниже.'; }
    };
    document.getElementById('fioBtn').onclick = go;
    fioInp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); fioInp.blur(); go(); } };
  }
  document.getElementById('pickSkip')?.addEventListener('click', () => {
    state.settings.group = 'none'; store.save('settings', state.settings); closeSheet(true); render();
  });
}
function pickGroup(gid) {
  const g = findGroup(gid);
  const choice = g.choice && groupsData.choices[g.choice];
  const done = async val => {
    state.settings.group = gid;
    state.settings.choices = { ...(state.settings.choices || {}) };
    if (choice) state.settings.choices[g.choice] = val;
    await applyGroup(); haptic('success'); closeSheet(true); render();
  };
  if (!choice) return done();
  const def = (state.settings.choices || {})[g.choice] || g.choiceDefault;
  openSheet(`<h2>${esc(choice.label)}</h2>
    <div class="hint" style="margin:-6px 0 12px">${esc(choice.hint)}</div>
    <div class="list" style="margin:0">${Object.entries(choice.options).map(([k, v]) => `<button class="card" data-opt="${k}" style="width:100%;text-align:left">
      <div class="body"><div class="title">${esc(v)}</div></div>${k === def ? '<span class="badge">по умолчанию</span>' : ''}</button>`).join('')}</div>`,
    null, { locked: true });
  $sheet.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => done(b.dataset.opt));
}


// ---------- формы (bottom sheet) ----------
const $sheet = document.getElementById('sheet');
const $sheetBg = document.getElementById('sheetBg');
let onSheetSave = null;

let sheetLocked = false;
function openSheet(html, onSave, opts = {}) {
  $sheet.innerHTML = html;
  onSheetSave = onSave;
  sheetLocked = !!opts.locked;
  $sheetBg.style.display = 'block';
  requestAnimationFrame(() => $sheet.classList.add('open'));
  if (inTg) {
    if (!opts.locked) tg.BackButton.show(); else tg.BackButton.hide();
    if (onSave) { tg.MainButton.setText('Сохранить'); tg.MainButton.show(); } else tg.MainButton.hide();
  }
  $sheet.querySelector('.btn.primary')?.addEventListener('click', submitSheet);
}
function closeSheet(force) {
  if (sheetLocked && force !== true) return;
  sheetLocked = false;
  $sheet.classList.remove('open');
  $sheetBg.style.display = 'none';
  onSheetSave = null;
  if (inTg) { tg.BackButton.hide(); tg.MainButton.hide(); }
}
async function submitSheet() {
  if (!onSheetSave) return;
  const ok = await onSheetSave();
  if (ok !== false) { haptic('success'); closeSheet(); render(); }
}
$sheetBg.onclick = () => closeSheet();
if (inTg) {
  tg.BackButton.onClick(() => closeSheet());
  tg.MainButton.onClick(submitSheet);
}

function lessonForm(l) {
  const isNew = !l;
  l = l || { day: state.tab === 'week' ? state.weekDay : Math.min(dayIdx(new Date()), 5), num: '', start: '', end: '', subject: '', type: 'lec', room: '', teacher: '', weeks: 'all' };
  const subjects = [...new Set(state.lessons.map(x => x.subject))];
  openSheet(`<h2>${isNew ? 'Новая пара' : 'Редактировать пару'}${isNew ? '' : '<button class="del" id="f-del">Удалить</button>'}</h2>
    <div class="field"><label>Предмет</label><input id="f-subject" list="subj" value="${esc(l.subject)}" placeholder="Математический анализ">
      <datalist id="subj">${subjects.map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
    <div class="row">
      <div class="field"><label>День</label><select id="f-day">${DAYS_FULL.map((d, i) => `<option value="${i}" ${i === l.day ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label>Тип</label><select id="f-type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${k === l.type ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>№ пары</label><select id="f-num"><option value="">—</option>${BELLS.map((b, i) => `<option value="${i + 1}" ${+l.num === i + 1 ? 'selected' : ''}>${i + 1} (${b[0]})</option>`).join('')}</select></div>
      <div class="field"><label>Начало</label><input type="time" id="f-start" value="${l.start}"></div>
      <div class="field"><label>Конец</label><input type="time" id="f-end" value="${l.end}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Аудитория</label><input id="f-room" value="${esc(l.room)}" placeholder="305 / Онлайн"></div>
      <div class="field"><label>Недели</label><select id="f-weeks">
        <option value="all" ${l.weeks === 'all' ? 'selected' : ''}>Каждую</option>
        <option value="odd" ${l.weeks === 'odd' ? 'selected' : ''}>Нечётная</option>
        <option value="even" ${l.weeks === 'even' ? 'selected' : ''}>Чётная</option></select></div>
    </div>
    <div class="field"><label>Преподаватель</label><input id="f-teacher" value="${esc(l.teacher)}" placeholder="Иванов И. И."></div>
    <button class="btn primary">Сохранить</button>`,
  async () => {
    const v = id => document.getElementById(id).value.trim();
    const data = { subject: v('f-subject'), day: +v('f-day'), type: v('f-type'), num: v('f-num'),
      start: v('f-start'), end: v('f-end'), room: v('f-room'), teacher: v('f-teacher'), weeks: v('f-weeks') };
    if (!data.subject) { toast('Укажите предмет'); return false; }
    if (!data.start || !data.end) { toast('Укажите время или номер пары'); return false; }
    if (toMin(data.end) <= toMin(data.start)) { toast('Конец пары раньше начала'); return false; }
    if (isNew) state.lessons.push({ id: uid(), ...data });
    else Object.assign(state.lessons.find(x => x.id === l.id), data);
    await store.save('lessons', state.lessons);
  });

  document.getElementById('f-num').onchange = e => {
    const b = BELLS[+e.target.value - 1];
    if (b) { document.getElementById('f-start').value = b[0]; document.getElementById('f-end').value = b[1]; }
  };
  // подставить последние аудиторию/преподавателя для уже известного предмета
  document.getElementById('f-subject').onchange = e => {
    const prev = state.lessons.find(x => x.subject === e.target.value);
    if (!prev) return;
    const room = document.getElementById('f-room'), teacher = document.getElementById('f-teacher');
    if (!room.value) room.value = prev.room;
    if (!teacher.value) teacher.value = prev.teacher;
  };
  document.getElementById('f-del')?.addEventListener('click', async () => {
    if (!await confirmAsk(`Удалить «${l.subject}»?`)) return;
    state.lessons = state.lessons.filter(x => x.id !== l.id);
    haptic('warning'); closeSheet(); render();
    store.save('lessons', state.lessons);
  });
}

function taskForm(t) {
  const isNew = !t;
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  t = t || { text: '', subject: '', due: isoDate(tomorrow) };
  const subjects = [...new Set(state.lessons.map(x => x.subject))];
  openSheet(`<h2>${isNew ? 'Новое задание' : 'Задание'}${isNew ? '' : '<button class="del" id="t-del">Удалить</button>'}</h2>
    <div class="field"><label>Что сделать</label><textarea id="t-text" placeholder="Лабораторная №3, задачи 1–5">${esc(t.text)}</textarea></div>
    <div class="row">
      <div class="field"><label>Предмет</label><select id="t-subject"><option value="">—</option>
        ${subjects.map(s => `<option ${s === t.subject ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
      <div class="field"><label>Срок</label><input type="date" id="t-due" value="${t.due || ''}"></div>
    </div>
    <button class="btn primary">Сохранить</button>`,
  async () => {
    const text = document.getElementById('t-text').value.trim();
    if (!text) { toast('Опишите задание'); return false; }
    const data = { text, subject: document.getElementById('t-subject').value, due: document.getElementById('t-due').value };
    if (isNew) state.tasks.push({ id: uid(), done: false, ...data });
    else Object.assign(state.tasks.find(x => x.id === t.id), data);
    await store.save('tasks', state.tasks);
  });
  document.getElementById('t-del')?.addEventListener('click', async () => {
    state.tasks = state.tasks.filter(x => x.id !== t.id);
    haptic('warning'); closeSheet(); render();
    store.save('tasks', state.tasks);
  });
}

// ---------- события ----------
document.querySelector('nav').onclick = e => {
  const b = e.target.closest('[data-tab]');
  if (!b || b.dataset.tab === state.tab) return;
  state.tab = b.dataset.tab; haptic('light'); window.scrollTo(0, 0); render();
};
$fab.onclick = () => { haptic(); state.tab === 'tasks' ? taskForm() : lessonForm(); };

$view.onclick = async e => {
  const el = e.target;
  const day = el.closest('[data-day]');
  if (day) { state.weekDay = +day.dataset.day; haptic('light'); return render(); }
  const wf = el.closest('[data-wf]');
  if (wf) { state.weekFilter = wf.dataset.wf; return render(); }
  const tf = el.closest('[data-tf]');
  if (tf) { state.taskFilter = tf.dataset.tf; return render(); }
  const tog = el.closest('[data-toggle]');
  if (tog) {
    const t = state.tasks.find(x => x.id === tog.dataset.toggle);
    t.done = !t.done; haptic(t.done ? 'success' : 'light');
    render(); return store.save('tasks', state.tasks);
  }
  const lc = el.closest('[data-lesson]');
  if (lc) return lessonForm(state.lessons.find(x => x.id === lc.dataset.lesson));
  const tc = el.closest('[data-task]');
  if (tc) return taskForm(state.tasks.find(x => x.id === tc.dataset.task));
};

// ---------- старт ----------
(async () => {
  const [lessons, tasks, settings] = await Promise.all([
    store.load('lessons', null), store.load('tasks', []), store.load('settings', null), loadGroups(),
  ]);
  state.lessons = lessons || [];
  state.tasks = tasks;
  if (settings) { delete settings.bells; Object.assign(state.settings, settings); }
  // группа, выбранная в чате с ботом: бот открывает приложение по ссылке ?g=A1&c=1
  const qs = new URLSearchParams(location.search);
  const qg = qs.get('g'), qc = qs.get('c');
  if (groupsData && findGroup(qg)) {
    const g = findGroup(qg);
    const choices = { ...(state.settings.choices || {}) };
    if (g.choice && qc && groupsData.choices[g.choice]?.options[qc]) choices[g.choice] = qc;
    else if (g.choice && !choices[g.choice] && g.choiceDefault) choices[g.choice] = g.choiceDefault;
    if (state.settings.group !== qg || JSON.stringify(choices) !== JSON.stringify(state.settings.choices || {})) {
      state.settings.group = qg; state.settings.choices = choices; await applyGroup();
    }
  }
  if (groupsData) {
    const gid = state.settings.group;
    if (findGroup(gid)) {
      // вуз обновил расписание → пересобираем группу
      if (state.settings.groupsVersion !== groupsData.version) await applyGroup();
    } else if (!gid && !state.lessons.some(l => l.src !== 'group' && !String(l.id).startsWith('seed'))) {
      render(); groupPicker(true);
    }
  }
  render();
  setInterval(() => { if (state.tab === 'today' && !onSheetSave) render(); }, 30_000);
})();
</script>
